<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18151e"><title>SakikoGames · 雨夜闪避</title><link rel="stylesheet" href="style.css"><script src="engine.js" defer></script><script src="game.js" defer></script></head>
<body><main id="game" aria-label="祥子雨夜闪避小游戏">
<canvas id="scene" aria-label="游戏场景。方向键或 A D 移动，空格跳跃，Shift 冲刺，Escape 暂停。"></canvas>
<header class="topbar"><a class="brand" href="./"><span class="brand-icon">S</span><span>SAKIKO<span class="brand-light">GAMES</span><small>酒瓶闪避</small></span></a><div class="tools"><button id="sound" class="icon-button" aria-label="开启音效" title="音效">♪<span>音效关</span></button><button id="fullscreen" class="icon-button" aria-label="进入全屏" title="全屏">⛶<span>全屏</span></button><button id="pause" class="icon-button" hidden aria-label="暂停游戏">Ⅱ<span>暂停</span></button></div></header>
<section id="hud" hidden aria-label="游戏状态"><div class="stat"><small>存活时间</small><strong id="time">00:00</strong></div><div class="stat"><small>闪避得分</small><strong id="score">00000</strong></div><div class="hud-right"><div id="hearts" aria-label="剩余三颗心">♥ ♥ ♥</div><div class="dash-meter"><span id="dash-fill"></span></div><small>冲刺 / SHIFT</small></div></section>
<div id="wave-toast" role="status"></div>
<section id="intro" class="overlay"><div class="intro-copy"><h1>酒瓶闪避</h1><div class="start-row"><button id="start" class="primary" disabled>正在准备房间…</button><div class="best"><small>你的最佳纪录</small><strong id="best">—</strong></div></div><p id="load-error" role="alert"></p><div class="control-guide"><span><kbd>A</kbd><kbd>D</kbd> 左右移动</span><span><kbd>SPACE</kbd> 跳跃</span><span><kbd>SHIFT</kbd> 冲刺</span></div></div></section>
<section id="pause-screen" class="overlay centered" hidden><div class="dialog"><h2>已暂停</h2><button id="resume" class="primary">继续游戏 <span>→</span></button><button id="restart-pause" class="secondary">重新开始</button></div></section>
<section id="result" class="overlay centered" hidden><div class="dialog"><h2>本局结束</h2><div class="results"><div><small>存活</small><strong id="final-time"></strong></div><div><small>得分</small><strong id="final-score"></strong></div><div><small>躲开酒瓶</small><strong id="final-dodges"></strong></div></div><p id="new-best"></p><button id="retry" class="primary">再来一次 <span>↗</span></button><button id="back" class="secondary">回到开始</button></div></section>
<footer id="bottom-hint" hidden><span><kbd>A</kbd><kbd>D</kbd> 移动 <kbd>SPACE</kbd> 跳跃 <kbd>SHIFT</kbd> 冲刺</span><span id="wave">第 01 波</span><span><kbd>ESC</kbd> 暂停</span></footer>
<div id="touch" hidden><div><button data-action="left" aria-label="向左">←</button><button data-action="right" aria-label="向右">→</button></div><div><button data-action="dash">冲刺</button><button data-action="jump">跳跃</button></div></div>
</main></body></html>
